<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="展览板内容展示" />
  <title>展览板内容入口</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: min(960px, 100%);
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 18px 48px rgba(37, 99, 235, 0.12);
      padding: 28px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: var(--muted); line-height: 1.7; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 24px;
    }
    .item {
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      background: #fcfdff;
    }
    .item img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 10px;
      border-radius: 12px;
      background: white;
      padding: 8px;
      border: 1px solid #e5e7eb;
    }
    .item a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .foot {
      margin-top: 20px;
      font-size: 14px;
      color: var(--muted);
    }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .container { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>展览板内容入口</h1>
    <p>扫描下面 6 个二维码，即可查看对应内容。页面为静态文件，微信打开更快，且可免费长期部署。</p>
    <div class="grid">
      <div class="item">
        <img src="pages/qr-01.png" alt="二维码 1" />
        <div><a href="pages/page-01.html">内容 1</a></div>
      </div>
      <div class="item">
        <img src="pages/qr-02.png" alt="二维码 2" />
        <div><a href="pages/page-02.html">内容 2</a></div>
      </div>
      <div class="item">
        <img src="pages/qr-03.png" alt="二维码 3" />
        <div><a href="pages/page-03.html">内容 3</a></div>
      </div>
      <div class="item">
        <img src="pages/qr-04.png" alt="二维码 4" />
        <div><a href="pages/page-04.html">内容 4</a></div>
      </div>
      <div class="item">
        <img src="pages/qr-05.png" alt="二维码 5" />
        <div><a href="pages/page-05.html">内容 5</a></div>
      </div>
      <div class="item">
        <img src="pages/qr-06.png" alt="二维码 6" />
        <div><a href="pages/page-06.html">内容 6</a></div>
      </div>
    </div>
    <div class="foot">提示：建议将页面部署到 GitHub Pages、Netlify 或 Vercel，均可免费使用。</div>
  </div>
</body>
</html>
